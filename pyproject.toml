[project]
name = "proyecto-docker-database"
version = "0.2.0"
description = "Entorno de datos reproducible (PostgreSQL + Redis + Jupyter + pgAdmin) con un pipeline ETL en Python"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: necesita PostgreSQL y Redis reales (docker compose up -d, o servicios de CI)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]  # consultas SQL largas en los tests
