name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint + tests unitarios y de integración PostgreSQL y Redis reales
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.14   # misma versión que docker-compose.yml
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ci_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci_user -d ci_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_USER: ci_user
      POSTGRES_PASSWORD: ci_password
      POSTGRES_DB: ci_db
      REDIS_HOST: localhost
      REDIS_PASSWORD: ci_redis_password
      REQUIRE_INTEGRATION: "1"   # si un servicio no responde, los tests fallan en vez de saltarse
    steps:
      - uses: actions/checkout@v4

      # Redis con contraseña, igual que en docker-compose.yml
      - name: Arrancar Redis con contraseña
        run: |
          docker run -d --name redis -p 6379:6379 redis:7.4.10-alpine \
            redis-server --requirepass "$REDIS_PASSWORD"
          for i in $(seq 1 20); do
            docker exec -e REDISCLI_AUTH="$REDIS_PASSWORD" redis redis-cli ping | grep -q PONG && exit 0
            sleep 1
          done
          echo "Redis no arrancó" && exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Tests
        run: pytest -v

  # Valida docker-compose.yml y comprueba que el stack real arranca y el ETL carga datos
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar .env desde la plantilla
        run: cp .env.example .env

      - name: Validar docker-compose.yml
        run: docker compose --profile etl config -q

      - name: Levantar PostgreSQL y Redis (esperando a los healthchecks)
        run: docker compose up -d --wait postgres redis

      - name: Ejecutar el ETL con la muestra bank.csv
        run: docker compose run --rm etl python -m src.etl --source dataset/bank.csv

      - name: Comprobar datos cargados
        run: |
          q() { docker compose exec -T postgres sh -c "psql -U \"\$POSTGRES_USER\" -d \"\$POSTGRES_DB\" -tAc \"$1\""; }
          test "$(q 'SELECT COUNT(*) FROM marketing.contactos')" = "4521"
          test "$(q 'SELECT COUNT(*) FROM clientes')" = "50"
          test "$(q 'SELECT COUNT(*) FROM detalle_pedidos')" = "200"

      - name: Redis exige contraseña
        run: |
          docker compose exec -T redis redis-cli ping | grep -q NOAUTH

      - name: Logs si algo falla
        if: failure()
        run: docker compose logs --no-color

      - name: Limpiar
        if: always()
        run: docker compose down -v
